; ESP32 Solana signer — step 1 "probe" firmware.
; Goal of this build: find out whether mobile wallets (Phantom, Jupiter, Solflare)
; accept a device that speaks the open Ledger Solana app protocol over BLE.
; It has NO real key yet: it hands out a fake address and refuses to sign.

[platformio]
default_envs = cyd

[common]
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; Cheap Yellow Display: classic ESP32-WROOM, no PSRAM, CH340 USB-serial.
; Screen is not used by the probe yet; serial log is enough.
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -D BLEND_CYD

; Display-less ESP32-C3 SuperMini / DevKitM. Logs go out the built-in USB serial/JTAG.
[env:c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -D BLEND_C3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Host-side unit tests for the APDU layer: `pio test -e native` (needs a C++ compiler).
[env:native]
platform = native
build_src_filter = +<apdu.cpp> +<keys.cpp>
test_build_src = yes
