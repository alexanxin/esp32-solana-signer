; Sigly: ESP32 Solana signer speaking the open Ledger Solana app protocol over BLE.
; Blends: cyd (touchscreen, press-and-hold to sign), c3 (no screen, BOOT button signs).
; DEVNET ONLY until the seed is protected.

[platformio]
default_envs = cyd

[common]
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; Cheap Yellow Display (ESP32-2432S028R): classic ESP32-WROOM, no PSRAM, CH340 USB-serial,
; 2.8" ILI9341 240x320 screen on HSPI; XPT2046 touch shares that bus (CS 33), backlight GPIO 27.
; LVGL 9 draws the screens (settings in include/lv_conf.h), TFT_eSPI drives the screen
; (its settings are the -D flags below instead of a User_Setup.h file).
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    ${common.lib_deps}
    lvgl/lvgl@9.2.2
    bodmer/TFT_eSPI@2.5.43
build_flags = ${common.build_flags} -D BLEND_CYD
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1
    -D TOUCH_CS=33
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=8000000
    -D SPI_TOUCH_FREQUENCY=2500000

; Display-less ESP32-C3 SuperMini / DevKitM. Logs go out the built-in USB serial/JTAG.
[env:c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_src_filter = +<*> -<ui_cyd.cpp> -<fonts/>
build_flags = ${common.build_flags} -D BLEND_C3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Host-side unit tests for the APDU layer: `pio test -e native` (needs a C++ compiler).
[env:native]
platform = native
build_src_filter = +<apdu.cpp> +<keys.cpp> +<tx_decode.cpp> +<pin_vault.cpp>
test_build_src = yes
